recipe_version: "2"
model: poolside/Laguna-S-2.1-NVFP4
# Pins the prefetch/distribution side. Must stay in sync with defaults.revision
# below, which pins the *serve* side — sparkrun does not inject model_revision
# into the command's placeholder chain, so the two are separate knobs.
model_revision: 07614121b31898586430f189d27a25a0be310843
runtime: vllm-distributed
min_nodes: 1
max_nodes: 1
container: eugr/spark-vllm:latest

metadata:
  description: >-
    Laguna-S-2.1 NVFP4 serving on one DGX Spark, pinned to the pre-RC2
    checkpoint (07614121, 2026-07-22 "spinquantless norot weights, 256K")
    rather than HF main. Main was moved to the RC2 checkpoint on 2026-08-01
    (1M context, 49 shards instead of 15); this recipe deliberately stays on
    the weights that predate that promotion. Because sparkrun sets
    HF_HUB_OFFLINE=1, vLLM resolves 'main' out of the local cache unless the
    revision is passed explicitly — hence the three --*revision flags. The
    remote code (configuration_laguna.py) differs between the two revisions,
    so --code-revision matters as much as --revision.
  quantization: nvfp4
  model_params: 117.6B
  model_dtype: nvfp4
  model_vram: 71
  kv_dtype: fp8

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  # Keep in sync with the top-level model_revision.
  revision: 07614121b31898586430f189d27a25a0be310843
  gpu_memory_utilization: 0.70
  max_model_len: 131072
  served_model_name: laguna-s-2.1-nvfp4
  max_num_batched_tokens: 16384
  max_num_seqs: 1

env:
  CUTE_DSL_ARCH: sm_121a
  MAX_JOBS: "4"

command: |
  vllm serve {model} \
    --revision {revision} \
    --code-revision {revision} \
    --tokenizer-revision {revision} \
    --trust-remote-code \
    --dtype auto \
    --safetensors-load-strategy lazy \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --tool-call-parser poolside_v1 \
    --reasoning-parser poolside_v1 \
    --enable-auto-tool-choice \
    --default-chat-template-kwargs '{"enable_thinking": true}' \
    --max-num-seqs {max_num_seqs} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --kv-cache-dtype fp8 \
    --host {host} \
    --port {port}
