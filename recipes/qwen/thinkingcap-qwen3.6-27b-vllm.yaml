description: BottleCap AI ThinkingCap Qwen3.6-27B on a single DGX Spark, using BottleCap's own NVFP4 build — the max-throughput multimodal profile (vision tower kept) with FP8 KV, the checkpoint's preserved MTP head at k=3, and async scheduling, serving the full native 262144-token context. ThinkingCap is a Qwen3.6-27B finetune that reaches the same answer quality and style with about 50% fewer thinking tokens, so the throughput win here compounds with the finetune's own token savings. The quantization is compressed-tensors nvfp4-pack-quantized from llm-compressor, so --quantization is deliberately omitted and vLLM autodetects it; the ModelOpt path the Qwen3.6-27B NVFP4 recipe uses does not apply. It is weight-only W4A16 — 4-bit weights (E2M1 with per-group-of-16 FP8 scales) against bf16 activations, roughly 19 GB instead of ~55 GB bf16. Because activations stay bf16 it serves through vLLM's MarlinNvFp4LinearKernel rather than native FP4 tensor cores, so the decode win is memory bandwidth (the card measures ~2.3x over the bf16 finetune) and any Marlin FP4 warnings in the log are expected rather than a misconfiguration. A W4A4 checkpoint would be needed for native FP4 compute. The card notes lm_head, the MTP head, the vision tower and the two narrow Gated-DeltaNet input gates (linear_attn.in_proj_a / in_proj_b) are kept in bf16 — those gates are 48-wide and fused to 96 at serve time, so quantizing them breaks loading on non-Blackwell GPUs, at a cost of only ~60 MB. Because the MTP head survives quantization, --speculative-config runs self-speculative decoding with no separate drafter, which the card measures at ~3.2 accepted tokens per verify step for a further ~1.5x. Speculative decoding here is lossless — identical output to standard decoding. generation_config ships the card's recommended sampling (temperature 1.0, top_p 0.95, top_k 20) so vLLM picks it up without an override. DGX Spark unified memory is 127.6 GB and vLLM's gpu_memory_utilization claims host RAM rather than a separate VRAM pool, so the usual "give the GPU most of the box" instinct is wrong here. 0.5 leaves the host comfortable alongside the vision tower and multimodal activation buffers while still allocating enough KV to serve the full native context, and this checkpoint's ~19 GB of weights leave noticeably more headroom than the ~31 GB FP8 build this recipe previously targeted. This recipe was switched off bottlecapai/ThinkingCap-Qwen3.6-27B-FP8, which remains gated for this account; the NVFP4 repo is gated too but access was granted. BottleCap still ship the FP8 build if SGLang support matters, since SGLang cannot load weight-only NVFP4 for this architecture — vLLM only. Weight loading uses --load-format instanttensor, which needs the instanttensor package in the image; eugr/spark-vllm:latest ships it (PyPI has x86_64 wheels only, so an image without it cannot pick this up cheaply — fall back to fastsafetensors there). Measured 2026-08-16 on vLLM 0.27.2rc1.dev113 at gpu_memory_utilization 0.5, and the predictions above hold. vLLM resolved the architecture as Qwen3_5MTP, selected MarlinNvFp4LinearKernel, and logged the expected 'Your GPU does not have native support for FP4 computation' warning, so the Marlin weight-only path is confirmed rather than assumed. instanttensor loaded the target in 3.67 s and the MTP draft in 3.58 s, model loading 19.3 GiB in 10.26 s, which matches the card's ~19 GB figure. KV cache 30.77 GiB giving 868,443 tokens and 3.31x concurrency at 262144. Available memory bottomed out at 51 GiB, so 0.5 is conservative on this checkpoint and there is room to raise it. init engine took 195.41 s of which torch.compile was 52.05 s. MTP self-speculation works and slightly beats the card's ~3.2 accepted tokens per step — five sampled windows gave mean acceptance length 3.30 to 3.67, average draft acceptance 76.7% to 89.1%, per-position roughly 0.88-0.94 then 0.78-0.87 then 0.63-0.87. vLLM warns that num_speculative_tokens greater than 1 reruns the same MTP layer and may lower acceptance; the measured numbers say k=3 is fine here. The server served a correct generation and a parsed tool call. One open question — reasoning_content came back null on a plain coding prompt that spent 543 tokens to produce a 60-token answer, so the thinking happened but did not surface through the qwen3 reasoning parser. Check that before relying on separated reasoning output.
model: bottlecapai/ThinkingCap-Qwen3.6-27B-NVFP4
container: eugr/spark-vllm:latest
mods: []
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.5
  max_model_len: 262144
  max_num_batched_tokens: 32768
  max_num_seqs: 16
  limit_mm_per_prompt: '{"image": 1, "video": 0}'
  served_model_name: thinkingcap-qwen3.6-27b
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'
env:
  MAX_JOBS: '2'
  NVCC_THREADS: '2'
  FLASHINFER_NVCC_THREADS: '2'
  CUTE_DSL_ARCH: sm_121a
  VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --load-format instanttensor \
    --kv-cache-dtype fp8 \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --limit-mm-per-prompt '{limit_mm_per_prompt}' \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --speculative-config '{speculative_config}'
recipe_version: "2"
name: ThinkingCap-Qwen3.6-27B-NVFP4-NVIDIA-DGX-Spark
cluster_only: false
solo_only: false
