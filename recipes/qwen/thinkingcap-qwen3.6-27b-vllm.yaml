model: bottlecapai/ThinkingCap-Qwen3.6-27B
runtime: vllm-distributed
min_nodes: 1
max_nodes: 1
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-tf5:latest

metadata:
  description: BottleCap AI ThinkingCap Qwen3.6 27B for token-efficient reasoning
  maintainer: Charitarth
  model_params: 27B
  model_dtype: bf16

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  served_model_name: thinkingcap-qwen3.6-27b

command: |
  vllm serve \
      {model} \
      --served-model-name {served_model_name} \
      --max-model-len {max_model_len} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      -tp {tensor_parallel} \
      --host {host} \
      --port {port} \
      --reasoning-parser qwen3 \
      --trust-remote-code
