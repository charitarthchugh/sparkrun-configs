description: BottleCap AI ThinkingCap Qwen3.6-27B FP8 checkpoint on a single DGX Spark — the max-throughput multimodal profile (vision tower kept, not language-model-only) with FP8 KV, built-in MTP k=3, and async scheduling. DGX Spark unified memory is 127.6 GB and vLLM's gpu_memory_utilization claims host RAM rather than a separate VRAM pool, so the usual "give the GPU most of the box" instinct is wrong here. 0.85 with an unbounded context OOMs the whole node, and even 0.7 leaves only ~3 GB free once FlashInfer autotuning allocates its workspace. 0.5 leaves the host comfortable alongside the vision tower and multimodal activation buffers while still allocating enough KV to serve the checkpoint's full native 262144-token context. Unlike the NVFP4 sibling this checkpoint is natively FP8 block-wise (weight_block_size 128x128), so it carries no --quantization override — vLLM reads quant_method from the checkpoint.
model: bottlecapai/ThinkingCap-Qwen3.6-27B-FP8
container: eugr/spark-vllm:latest
mods: []
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.5
  max_model_len: 262144
  max_num_batched_tokens: 32768
  max_num_seqs: 16
  limit_mm_per_prompt: '{"image": 1, "video": 0}'
  served_model_name: thinkingcap-qwen3.6-27b
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'
env:
  MAX_JOBS: '2'
  NVCC_THREADS: '2'
  FLASHINFER_NVCC_THREADS: '2'
  CUTE_DSL_ARCH: sm_121a
  VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
command: |
  vllm serve bottlecapai/ThinkingCap-Qwen3.6-27B-FP8 \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --load-format fastsafetensors \
    --kv-cache-dtype fp8 \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --limit-mm-per-prompt '{limit_mm_per_prompt}' \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --speculative-config '{speculative_config}'
recipe_version: "2"
name: ThinkingCap-Qwen3.6-27B-FP8-NVIDIA-DGX-Spark
cluster_only: false
solo_only: false
