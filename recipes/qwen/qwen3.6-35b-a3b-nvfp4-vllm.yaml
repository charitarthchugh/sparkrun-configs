recipe_version: "1"
name: Qwen36-35B-A3B-NVFP4-nvidia
description: >-
  vLLM serving nvidia/Qwen3.6-35B-A3B-NVFP4 with --load-format instanttensor.
  container is set to eugr/spark-vllm:latest rather than the locally-built
  vllm-node image, to match the rest of the registry.

  Be aware that the container line is not what actually runs here. Measured
  2026-08-16: sparkrun launched this recipe on
  ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest despite both the recipe and
  `sparkrun run --dry-run` reporting eugr/spark-vllm:latest — different image
  IDs, confirmed against the container named for this job. The nemotron-omni
  recipe launches on exactly the image it names, so the substitution is specific
  to this recipe, which is also the only one where sparkrun runs a Building step
  instead of skipping it. No image mapping was found in ~/.config/sparkrun/. The
  test below therefore describes the nightly image; it happens to ship
  instanttensor too, which is why the loader worked at all.

  Measured on that image, vLLM 0.27.2rc1.dev113: weights in 24.99 s, MTP head in
  9.34 s, model loading 21.96 GiB in 43.05 s. KV cache 3,928,360 tokens, 14.99x
  concurrency at 262144. Served a correct generation and a parsed tool call, and
  MTP held up — mean acceptance length 3.32, 77.4% average draft acceptance,
  per-position 0.910/0.759/0.654. The --moe-backend marlin,
  --attention-backend flashinfer and VLLM_MARLIN_USE_ATOMIC_ADD settings were
  chosen against the old image and all survived the move.

  One surprise worth recording: the engine resolves quantization=modelopt_mixed
  and logs "Your GPU does not have native support for FP4 computation", falling
  back to Marlin weight-only FP4 compression, which it warns may degrade
  compute-heavy workloads. That is unexpected on GB10 and differs from how the
  other NVFP4 recipes resolve. It is observed behavior on this image, not
  something this recipe sets.

  Startup caching relies on sparkrun 0.3.5, which mounts a per-model host
  directory at /cache/runtime and points VLLM_CACHE_ROOT,
  TORCHINDUCTOR_CACHE_DIR, TRITON_CACHE_DIR and XDG_CACHE_HOME into it, so this
  recipe sets none of those paths itself — a path in env wins over the managed
  one and would escape the keyed, pruned tree. The single addition is
  FLASHINFER_WORKSPACE_BASE, because FlashInfer 0.6.18 reads only that variable
  and derives its own cache dir internally, leaving sparkrun's
  FLASHINFER_CACHE_DIR export inert; without it the JIT-compiled kernels sit in
  /tmp and die with the --rm container. This recipe is the cleanest case of the
  four measured on 2026-08-18. Three consecutive launches, the first with the
  runtime-cache tree deleted, gave wall clock to Application startup complete of
  279 s, 156 s and 157 s, with init engine 134.92 s (44.84 s compilation), then
  41.57 s (16.95 s) and 43.21 s (16.96 s). The FlashInfer autotune config hash
  was identical on all three (25cdbfa6...), so its 69 fp8_gemm configs are
  reused from the second launch on — the third logged "0 new, 69 from previous
  config". That is unlike the Laguna recipes, whose hash changes every launch,
  and unlike Muse-Glimmer, which needs three launches before it settles. The
  tree lands around 116 MB, 68 MB of Triton, 47 MB of vLLM torch_compile_cache,
  1.7 MB of FlashInfer JIT objects, and every launch served a chat completion.
model: nvidia/Qwen3.6-35B-A3B-NVFP4
container: eugr/spark-vllm:latest
cluster_only: false

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.65
  max_model_len: 262144
  max_num_batched_tokens: 32768
  max_num_seqs: 4

env:
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  # FlashInfer 0.6.18 reads only this env var for its JIT cache location
  # (sparkrun's FLASHINFER_CACHE_DIR export is inert), so without it the
  # compiled kernels land in /tmp and die with the --rm container.
  FLASHINFER_WORKSPACE_BASE: /cache/runtime/flashinfer-home

command: |
  vllm serve nvidia/Qwen3.6-35B-A3B-NVFP4 \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --kv-cache-dtype fp8 \
    --attention-backend flashinfer \
    --moe-backend marlin \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --speculative-config '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}' \
    --load-format instanttensor \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice
