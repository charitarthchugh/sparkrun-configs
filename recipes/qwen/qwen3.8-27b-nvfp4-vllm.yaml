description: Unsloth Dynamic v3.0 NVFP4 checkpoint of Qwen3.8-27B on a single DGX Spark — the max-throughput multimodal profile (vision tower kept) with FP8 KV, the checkpoint's built-in MTP head at k=3, and async scheduling, serving the full native 262144-token context. Unlike the Qwen3.6-27B recipes this is a compressed-tensors mixed-precision checkpoint, not a ModelOpt one, so --quantization is deliberately omitted and vLLM autodetects it (logs confirm quantization=compressed-tensors); passing "modelopt" here would misread the weights. The layout is NVFP4 (group size 16, FP8-E4M3 scales) on the MLP gate/up/down projections, FP8 W8A8 on the attention and Gated DeltaNet projections plus lm_head and the last eight layers' MLPs, and an unquantized vision tower — roughly 23.4 GB of weights including the separate MTP head. Qwen3.8 inherits the Qwen3.5 hybrid layout, so only 16 of the 64 layers carry full attention (4 KV heads at head_dim 256), which makes KV unusually cheap — measured ~37 KiB/token at fp8, plus DeltaNet recurrent state per sequence that is constant regardless of length. DGX Spark unified memory is 127.6 GB and vLLM's gpu_memory_utilization claims host RAM rather than a separate VRAM pool, so 0.7 is higher than the 0.5 the Qwen3.6 recipes settled on, and it was checked rather than assumed here — 53.24 GiB of KV, 1,502,568 tokens, 5.73x concurrency at the full context, with roughly 26-30 GB still available to the host while serving. The old warning that 0.7 starves the node came from a config with an unbounded context; with max_model_len pinned to the native 262144 it holds up fine. The model is extensible to 1M via static YaRN, but that is deliberately not enabled — vLLM applies the scaling to every request including short ones, and Qwen advises against it unless the length is actually needed. To turn it on, add rope_overrides with rope_type yarn and factor 4.0 passed through --hf-overrides, set VLLM_ALLOW_LONG_MAX_MODEL_LEN=1, and raise max_model_len; that combination was verified retrieving a needle at 286,985 tokens. mm_processor_kwargs is not cosmetic — the vision tower has only 2304 position embeddings, and any image that resizes past that (anything much over ~1500x1500) fails the request with a 400 from Qwen3VLProcessor. The 2 Mpx budget makes the processor downscale instead, capping images at ~2016 vision tokens — a 4000x3000 photo goes through fine. Tool calls use the qwen3_xml parser to match repo convention and are verified emitting parsed tool_calls; vLLM's qwen3_coder parser reads the same <tool_call>/<function=> template if you prefer it. MTP pays off well on this checkpoint — measured 86.1% draft acceptance, mean acceptance length 3.58, per-position 0.958/0.854/0.771. Tested on vLLM 0.27.2rc1 in eugr/spark-vllm:latest.
model: unsloth/Qwen3.8-27B-NVFP4
container: eugr/spark-vllm:latest
mods: []
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.7
  max_model_len: 262144
  max_num_batched_tokens: 32768
  max_num_seqs: 16
  limit_mm_per_prompt: '{"image": 1, "video": 0}'
  mm_processor_kwargs: '{"size": {"longest_edge": 2097152, "shortest_edge": 65536}}'
  served_model_name: qwen3.8-27b
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'
env:
  MAX_JOBS: '2'
  NVCC_THREADS: '2'
  FLASHINFER_NVCC_THREADS: '2'
  CUTE_DSL_ARCH: sm_121a
  VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
command: |
  vllm serve unsloth/Qwen3.8-27B-NVFP4 \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --load-format fastsafetensors \
    --kv-cache-dtype fp8 \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --limit-mm-per-prompt '{limit_mm_per_prompt}' \
    --mm-processor-kwargs '{mm_processor_kwargs}' \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --speculative-config '{speculative_config}'
recipe_version: "2"
name: Qwen3.8-27B-NVFP4-Unsloth-DGX-Spark
cluster_only: false
solo_only: false
