description: NVIDIA Qwen3.6-27B NVFP4 ModelOpt checkpoint on a single DGX Spark — the max-throughput multimodal profile (vision tower kept, not language-model-only) with FP8 KV, built-in MTP k=3, and async scheduling. DGX Spark unified memory is 127.6 GB and vLLM's gpu_memory_utilization claims host RAM rather than a separate VRAM pool, so the usual "give the GPU most of the box" instinct is wrong here. 0.85 with an unbounded context OOMs the whole node, and even 0.7 (74 GiB of KV) leaves only ~3 GB free once FlashInfer autotuning allocates its workspace. 0.5 leaves the host comfortable alongside the vision tower and multimodal activation buffers while still allocating ~49.5 GiB of KV, enough to serve the checkpoint's full native 262144-token context (text_config.max_position_embeddings, no rope scaling) at roughly 4x concurrency. Weight loading uses --load-format instanttensor, switched from fastsafetensors to match the rest of the registry; it needs the instanttensor package in the image, which eugr/spark-vllm:latest ships (PyPI has x86_64 wheels only, so an image without it cannot pick this up cheaply — fall back to fastsafetensors there). Measured 2026-08-16 on vLLM 0.27.2rc1.dev113 — weights in 3.48 s, MTP head in 3.57 s, model loading 20.57 GiB in 11.17 s. That run followed the checkpoint download, so the page cache was warm and it is a best case rather than a cold-start figure; for comparison the poolside checkpoints measured 3.2-3.5x over fastsafetensors and ~12x over the mmap loader on cold reads. KV cache came out at 849,405 tokens, 3.24x concurrency at 262144. Served a correct generation and a parsed tool call, with MTP at 84.2% average draft acceptance, mean acceptance length 3.53, per-position 0.956/0.835/0.736. Startup caching follows the ThinkingCap recipe, which serves the same Qwen3.6-27B architecture and is where the measurement was taken. sparkrun 0.3.5 mounts a per-model host directory at /cache/runtime and points VLLM_CACHE_ROOT, TORCHINDUCTOR_CACHE_DIR, TRITON_CACHE_DIR and XDG_CACHE_HOME into it, so this recipe sets none of those paths itself — a path in the env block wins over the managed one and would escape the keyed, pruned tree. The single addition is FLASHINFER_WORKSPACE_BASE, because FlashInfer 0.6.18 reads only that variable and derives its own cache dir internally, leaving sparkrun's FLASHINFER_CACHE_DIR export inert; without it the JIT-compiled kernels sit in /tmp and die with the --rm container. This one was not measured on its own — ThinkingCap went 300 s, 196 s, 188 s over three launches, and the change is carried here on that basis. Expect the gain to be larger here rather than smaller, because ThinkingCap takes the Marlin weight-only path and runs no FlashInfer autotune sweeps at all, whereas this ModelOpt checkpoint does autotune (the note above about autotuning workspace allocation at 0.7 is the same step), so there is a cached autotune result here that ThinkingCap has nothing to gain from. That is reasoning, not a measurement.
model: nvidia/Qwen3.6-27B-NVFP4
container: eugr/spark-vllm:latest
mods: []
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.5
  max_model_len: 262144
  max_num_batched_tokens: 32768
  max_num_seqs: 16
  limit_mm_per_prompt: '{"image": 1, "video": 0}'
  served_model_name: qwen3.6-27b
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'
env:
  # FlashInfer 0.6.18 reads only this env var for its JIT cache location
  # (sparkrun's FLASHINFER_CACHE_DIR export is inert), so without it the
  # compiled kernels land in /tmp and die with the --rm container.
  FLASHINFER_WORKSPACE_BASE: /cache/runtime/flashinfer-home
  MAX_JOBS: '2'
  NVCC_THREADS: '2'
  FLASHINFER_NVCC_THREADS: '2'
  CUTE_DSL_ARCH: sm_121a
  VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '600'
  FLASHINFER_DISABLE_VERSION_CHECK: '1'
command: |
  vllm serve nvidia/Qwen3.6-27B-NVFP4 \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --quantization modelopt \
    --load-format instanttensor \
    --kv-cache-dtype fp8 \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-num-seqs {max_num_seqs} \
    --limit-mm-per-prompt '{limit_mm_per_prompt}' \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_xml \
    --reasoning-parser qwen3 \
    --speculative-config '{speculative_config}'
recipe_version: "2"
name: Qwen3.6-27B-NVFP4-NVIDIA-DGX-Spark
cluster_only: false
solo_only: false
